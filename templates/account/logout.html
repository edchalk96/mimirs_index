{% extends "base.html" %}
{% load i18n %}
{% load allauth account %}

{% block head_title %}{% trans "Sign Out" %}{% endblock head_title %}

{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="text-center mb-4">{% trans "Exit the Sagas" %}</h3>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form class="logout" action="{% url 'account_logout' %}" method="post">
                {% csrf_token %}
                {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                {% endif %}
                <button class="btn btn-signup right" type="submit">{% trans "Leave the Halls" %}</button>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
